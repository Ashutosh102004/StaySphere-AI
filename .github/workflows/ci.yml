name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        env:
          NODE_PATH: ${{ github.workspace }}/apps/web/node_modules

      - name: Backend typecheck
        run: npm run typecheck --workspace=@staysphere/api

      - name: Frontend typecheck
        run: npm run typecheck --workspace=@staysphere/web

      - name: Backend tests
        run: npm test --workspace=@staysphere/api

      - name: Frontend production build
        run: npm run build --workspace=@staysphere/web
