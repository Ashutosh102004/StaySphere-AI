---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staysphere-ingress
  namespace: staysphere
  labels:
    app: staysphere
  annotations:
    # For nginx-ingress controller
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # For cert-manager (automatic SSL)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # ingressClassName: nginx  # Uncomment if using nginx-ingress
  # tls:
  #   - hosts:
  #       - staysphere.example.com
  #       - api.staysphere.example.com
  #     secretName: staysphere-tls
  rules:
    - host: staysphere.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
    - host: api.staysphere.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 5000
