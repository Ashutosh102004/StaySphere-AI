---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: staysphere
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: staysphere
  labels:
    app: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: staysphere/api:latest  # Replace with actual image registry
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          env:
            # Non-secret configuration from ConfigMap
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: staysphere-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: staysphere-config
                  key: PORT
            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: staysphere-config
                  key: CLIENT_URL
            - name: JWT_ACCESS_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: staysphere-config
                  key: JWT_ACCESS_EXPIRATION
            - name: JWT_REFRESH_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: staysphere-config
                  key: JWT_REFRESH_EXPIRATION
            - name: AI_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: staysphere-config
                  key: AI_PROVIDER
            - name: AI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: staysphere-config
                  key: AI_MODEL
            - name: IDENTITY_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: staysphere-config
                  key: IDENTITY_PROVIDER

            # Database connection
            - name: MONGODB_URI
              value: "mongodb://$(MONGODB_USER):$(MONGODB_PASSWORD)@mongodb-service:27017/$(MONGODB_DATABASE)?authSource=$(MONGODB_AUTH_SOURCE)"
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: staysphere-secrets
                  key: MONGODB_USER
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: staysphere-secrets
                  key: MONGODB_PASSWORD
            - name: MONGODB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: staysphere-config
                  key: MONGODB_DATABASE
            - name: MONGODB_AUTH_SOURCE
              valueFrom:
                configMapKeyRef:
                  name: staysphere-config
                  key: MONGODB_AUTH_SOURCE

            # Redis connection
            - name: REDIS_URL
              value: "redis://redis-service:6379"

            # Secrets
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: staysphere-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: staysphere-secrets
                  key: JWT_REFRESH_SECRET
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: staysphere-secrets
                  key: AI_API_KEY
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: staysphere-secrets
                  key: RAZORPAY_KEY_ID
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: staysphere-secrets
                  key: RAZORPAY_KEY_SECRET
            - name: RAZORPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: staysphere-secrets
                  key: RAZORPAY_WEBHOOK_SECRET
            - name: IDENTITY_PROVIDER_KEY
              valueFrom:
                secretKeyRef:
                  name: staysphere-secrets
                  key: IDENTITY_PROVIDER_KEY
            - name: IDENTITY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: staysphere-secrets
                  key: IDENTITY_WEBHOOK_SECRET

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

      restartPolicy: Always
      securityContext:
        fsGroup: 1000
