---
apiVersion: v1
kind: Namespace
metadata:
  name: staysphere
  labels:
    app: staysphere
    environment: production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: staysphere-config
  namespace: staysphere
data:
  # API Configuration
  NODE_ENV: "production"
  PORT: "5000"
  JWT_ACCESS_EXPIRATION: "15m"
  JWT_REFRESH_EXPIRATION: "7d"

  # AI Provider
  AI_PROVIDER: "kiro"
  AI_MODEL: "claude-sonnet-4.5"

  # Identity Provider
  IDENTITY_PROVIDER: "mock"

  # Database
  MONGODB_HOST: "mongodb-service"
  MONGODB_PORT: "27017"
  MONGODB_DATABASE: "staysphere-ai"
  MONGODB_AUTH_SOURCE: "admin"

  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # Frontend
  VITE_API_URL: "https://api.staysphere.example.com/api/v1"
  CLIENT_URL: "https://staysphere.example.com"

  # API Service Discovery
  API_URL: "http://api-service:5000"
