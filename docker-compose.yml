version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:7.0-alpine
    container_name: staysphere-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: staysphere-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: staysphere-api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      MONGODB_URI: mongodb://root:example@mongodb:27017/staysphere-ai?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      AI_PROVIDER: kiro
      AI_MODEL: claude-sonnet-4.5
      AI_API_KEY: ${AI_API_KEY:-dev-key}
      IDENTITY_PROVIDER: mock
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-test}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-test}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend web app
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: staysphere-web
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
  redis_data:
